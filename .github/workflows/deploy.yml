name: Deploy Next.js to AWS ECS via Self-Hosted Runner

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1                   # Replace with your AWS Region
  ECR_REPOSITORY: nextjs-sample-app       # Replace with your ECR Repository Name
  ECS_CLUSTER: nextjs-cluster             # Replace with your ECS Cluster Name
  ECS_SERVICE: nextjs-service             # Replace with your ECS Service Name
  CONTAINER_NAME: nextjs-container         # Must match the container name in task-definition.json

jobs:
  deploy:
    name: Build, Push, and Deploy
    # Crucial: Tells GitHub to run this on your AWS EC2 instance, not GitHub servers
    runs-on: self-hosted

    steps:
      # Step 1: Check out the repository code onto the EC2 machine
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Log in to ECR (Automatically uses the EC2 Instance IAM Profile)
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Step 3: Build the Docker image locally and push internally to ECR
      - name: Build, Tag, and Push Image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # Step 4: Map out the new task definition layout
      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      # Step 5: Execute the rolling service deployment update on ECS
      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
